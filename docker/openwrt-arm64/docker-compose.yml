services:
  openwrt:
    image: openclash-dev:25.12.5-arm64-x365
    platform: linux/arm64
    container_name: openclash-openwrt-arm64
    privileged: true
    environment:
      INITRAMFS: "1"
      # OpenWrt 的 musl 基础镜像未安装 IANA tzdata，使用 POSIX 时区字符串。
      TZ: CST-8
      OPENCLASH_LUCI_LANGUAGE: "${OPENCLASH_LUCI_LANGUAGE:-zh_cn}"
    ports:
      - "${OPENCLASH_BIND_ADDRESS:-0.0.0.0}:${OPENCLASH_LUCI_HTTP_PORT:-18080}:80"
      - "${OPENCLASH_BIND_ADDRESS:-0.0.0.0}:${OPENCLASH_LUCI_HTTPS_PORT:-18443}:443"
      - "${OPENCLASH_BIND_ADDRESS:-0.0.0.0}:${OPENCLASH_MIXED_PORT:-17890}:7890"
      - "${OPENCLASH_BIND_ADDRESS:-0.0.0.0}:${OPENCLASH_SOCKS_PORT:-17891}:7891"
      - "${OPENCLASH_BIND_ADDRESS:-0.0.0.0}:${OPENCLASH_CONTROLLER_PORT:-29090}:9090"
    secrets:
      - root_password
    volumes:
      - openclash_etc:/etc/openclash
      - openclash_uci:/etc/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ubus call system board >/dev/null 2>&1 && ubus call service list >/dev/null 2>&1 && test \"$$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/cgi-bin/luci/)\" = 403"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  openclash_etc:
  openclash_uci:

secrets:
  root_password:
    file: ./.secrets/root_password
